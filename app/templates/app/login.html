{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NC Interno</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
        .login-card { background: white; padding: 38px 40px 40px; border-radius: 16px; box-shadow: 0 12px 35px rgba(0,0,0,0.12); width: min(100%, 410px); }
        .login-brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 28px; }
        .login-logo { width: 74px; height: 84px; object-fit: contain; margin-bottom: 12px; }
        .login-logo.logo-dark { display: none; }
        html[data-theme="dark"] .login-logo.logo-light { display: none; }
        html[data-theme="dark"] .login-logo.logo-dark { display: block; }
        h1 { text-align: center; color: var(--primary) !important; font-size: 27px; margin: 0; }
        .login-subtitle { color: var(--text-muted) !important; font-size: 14px; margin-top: 5px; }
        form { width: 100%; }
        .form-field { width: 100%; margin-bottom: 18px; }
        label { display: block; color: var(--text); font-size: 14px; font-weight: 700; margin-bottom: 7px; }
        input { display: block; width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text); font-size: 15px; outline: none; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 16%, transparent); }
        button { display: block; width: 100%; background: #1a73e8; color: white; border: none; padding: 12px; border-radius: 9px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 6px; }
        button:hover { background: #1557b0; }
        .error { color: #d32f2f !important; text-align: center; font-size: 14px; margin-top: 18px; }
        @media (max-width: 480px) { .login-card { padding: 30px 24px 32px; } }
    </style>
    <link rel="stylesheet" href="/static/app/theme.css?v=20260730-1">
    <script src="/static/app/theme.js?v=20260728-2"></script>
</head>
<body>
    <div class="login-card">
        <div class="login-brand">
            <img class="login-logo logo-light" src="{% static 'app/images/netcamp-logo-blue.png' %}" alt="NetCamp">
            <img class="login-logo logo-dark" src="{% static 'app/images/netcamp-logo-white.png' %}" alt="">
            <h1>NC Interno</h1>
            <p class="login-subtitle">Acesso ao sistema</p>
        </div>
        <form method="post" id="loginForm">
            {% csrf_token %}
            <div class="form-field">
                <label for="{{ form.username.id_for_label }}">Usuário</label>
                {{ form.username }}
            </div>
            <div class="form-field">
                <label for="{{ form.password.id_for_label }}">Senha</label>
                {{ form.password }}
            </div>
            <button type="submit">Entrar</button>
        </form>
        {% if form.errors %}
            <p class="error">Usuário ou senha inválidos.</p>
        {% endif %}
    </div>
</body>
</html>
